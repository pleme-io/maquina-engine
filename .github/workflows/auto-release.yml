on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    # Direct per-language reusable, NOT the polymorphic auto-release.yml
    # shim: that shim startup_failure's for every consumer (0 jobs, no
    # annotations), so releases here never even started.
    uses: pleme-io/substrate/.github/workflows/cargo-auto-release.yml@main
    secrets: inherit
